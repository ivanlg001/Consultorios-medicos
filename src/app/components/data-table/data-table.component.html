<div class="result-card">

  <!-- Cabecera -->
  <div class="card-header">
    <div class="card-icon" [ngClass]="iconColor">
      <ng-container *ngIf="iconColor === 'purple'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
      </ng-container>
      <ng-container *ngIf="iconColor === 'teal'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M9 11l3 3L22 4"/>
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
        </svg>
      </ng-container>
    </div>
    <div>
      <h2 class="card-title">{{ title }}</h2>
      <p class="card-subtitle">{{ rows.length }} registros · {{ columns.length }} columnas</p>
    </div>
  </div>

  <!-- Sin datos -->
  <div class="no-data" *ngIf="rows.length === 0">
    <p>No se encontraron datos en la hoja <strong>{{ sheetName }}</strong></p>
    <p class="hint" *ngIf="availableHeaders.length > 0">
      Columnas disponibles: {{ availableHeaders.join(', ') }}
    </p>
  </div>

  <!-- Tabla -->
  <div class="table-wrap" *ngIf="rows.length > 0">
    <table>
      <thead>
        <tr>
          <th class="col-idx">#</th>
          <th *ngFor="let col of columns">{{ col.label }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of rows; let i = index"
            class="clickable"
            [class.revisado]="row.revisado"
            [class.error]="row.errores?.length > 0 && !row.revisado"
            (click)="rowClick.emit(row)">
          <td class="idx">{{ i + 1 }}
            <span class="check-mark" *ngIf="row.revisado">✓</span>
          </td>

          <td *ngFor="let col of columns">
          <span class="cell-alert" *ngIf="row[col.key]?.toString().includes('SIN_CATALOGO'); else normal">
            ⚠️ {{ row[col.key] | slice:12:-1 }}
          </span>
          <ng-template #normal>{{ row[col.key] }}</ng-template>
        </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
