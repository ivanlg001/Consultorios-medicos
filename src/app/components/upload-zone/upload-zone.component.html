<div
  class="upload-zone"
  [class.drag-over]="isDragging"
  [class.has-file]="fileName"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave()"
  (drop)="onDrop($event)"
  (click)="fileInput.click()">

  <input
    #fileInput
    type="file"
    accept=".xlsx,.xls"
    style="display:none"
    (change)="onFileChange($event)">

  <!-- Estado: sin archivo -->
  <div class="upload-content" *ngIf="!fileName">
    <div class="upload-icon">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <polyline points="16 16 12 12 8 16"/>
        <line x1="12" y1="12" x2="12" y2="21"/>
        <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
      </svg>
    </div>
    <p class="upload-title">Arrastra tu archivo aquí</p>
    <p class="upload-hint">o haz clic para seleccionarlo</p>
    <span class="upload-badge">XLSX / XLS</span>
  </div>

  <!-- Estado: archivo cargado -->
  <div class="file-selected" *ngIf="fileName">
    <div class="file-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
      </svg>
    </div>
    <div class="file-info">
      <p class="file-name">{{ fileName }}</p>
      <p class="file-hint">Haz clic para cambiar el archivo</p>
    </div>
    <div class="file-check">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
  </div>

</div>
